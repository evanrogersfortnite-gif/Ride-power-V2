plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.interop.ridepowerble'
    compileSdk 34

    defaultConfig {
        applicationId "com.interop.ridepowerble"
        minSdk 26
        targetSdk 34
        // version code/name come from CI (-Pvcode / -Pvname) so each build is an update
        versionCode (project.hasProperty("vcode") ? project.getProperty("vcode").toInteger() : 1)
        versionName (project.hasProperty("vname") ? project.getProperty("vname") : "1.0")
    }

    // Fixed signing key so every build updates in place (no "app not installed").
    signingConfigs {
        // Key password comes from the VOLTROUTE_KS_PASS GitHub secret, never from the repo.
        ridepower {
            storeFile file("voltroute.keystore")
            storePassword System.getenv("VOLTROUTE_KS_PASS") ?: ""
            keyAlias "voltroute"
            keyPassword System.getenv("VOLTROUTE_KS_PASS") ?: ""
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ridepower
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.maplibre.gl:android-sdk:11.0.0'
}
