name: Build APK

on:
  push:
    branches: [ "ccr-f9edd765-jnom4m" ]
    paths: [ "android/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        env:
          VOLTROUTE_KS_PASS: ${{ secrets.VOLTROUTE_KS_PASS }}
        run: |
          if [ -z "$VOLTROUTE_KS_PASS" ]; then echo "::error::Add the VOLTROUTE_KS_PASS repository secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          gradle assembleDebug --no-daemon --stacktrace -Pvcode=${GITHUB_RUN_NUMBER} -Pvname=1.0.${GITHUB_RUN_NUMBER}

      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "VoltRoute-1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la VoltRoute-*.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltRoute-apk
          path: VoltRoute-*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clean up the stale apk-latest release (its asset was deleted by an earlier run).
          gh release delete apk-latest --cleanup-tag --yes || true
          VER="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VER}"
          NOTES="VoltRoute ${VER}. Download VoltRoute-${VER}.apk below and tap Update. Newest build is always at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest"
          n=0
          until [ "$n" -ge 6 ]; do
            if gh release create "$TAG" "VoltRoute-${VER}.apk" \
                 --title "VoltRoute ${VER}" --notes "$NOTES"; then
              echo "Released $TAG"
              # keep the newest 3 releases (so an update already downloading isn't cut off)
              KEEP=$(gh release list --limit 200 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[0:3][] | .tagName')
              gh release list --limit 200 --json tagName -q '.[].tagName' | grep -vxF "$KEEP" | while read -r t; do
                gh release delete "$t" --cleanup-tag --yes || true
              done
              # remove leftover tags that have no release (old history we don't publish)
              gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate -q '.[].name' | grep -vxF "$KEEP" | while read -r t; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" || true
              done
              exit 0
            fi
            n=$((n+1)); echo "release attempt $n failed (likely transient GitHub 5xx); retrying in 20s"; sleep 20
          done
          echo "::error::release creation failed after retries"; exit 1
